name: Validate Ulsan research data

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check data integrity
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Export modern control points
        run: python scripts/export_geojson.py --output outputs/control_points.geojson
